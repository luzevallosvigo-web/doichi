<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2C200">
<title>Doichi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Doichi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --paper:#FFFFFF; --ink:#1D1D1B; --muted:#6E6C66; --line:#E4E2DC; --soft:#F2F1ED;
  --yellow:#F2C200; --green:#2F7A4E; --red:#C33A2E; --blue:#2C5AA0; --plum:#6B2C58;
  --on-dark:#FFFFFF; --on-yellow:#1D1D1B;
  --ok:#2F7A4E; --warn:#B7791F; --bad:#C33A2E;
  --hl:#DCEFE3; --strike:#FBE4E1; --focus:#2C5AA0;
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --cond:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#17181A; --ink:#ECEBE6; --muted:#9E9D97; --line:#2F3034; --soft:#232428;
    --green:#3E9663; --red:#D5574B; --blue:#4677C4; --plum:#9A4F84; --ok:#4FB078; --bad:#E06A5E; --warn:#D9A040;
    --hl:#1E3B2A; --strike:#40231F; --focus:#8FB3F0;
  }
}
:root[data-theme="dark"]{
  --paper:#17181A; --ink:#ECEBE6; --muted:#9E9D97; --line:#2F3034; --soft:#232428;
  --green:#3E9663; --red:#D5574B; --blue:#4677C4; --plum:#9A4F84; --ok:#4FB078; --bad:#E06A5E; --warn:#D9A040;
  --hl:#1E3B2A; --strike:#40231F; --focus:#8FB3F0;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:14px}
[hidden]{display:none !important}

#app{height:100%}
.screen{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}

/* Home */
#home{display:block;overflow-y:auto;padding:28px 18px 36px}
.brand{font-family:var(--cond);font-weight:700;font-size:76px;line-height:.88;letter-spacing:-.015em;margin:0}
.hello{font-family:var(--serif);font-size:19px;line-height:1.45;margin:12px 0 26px;color:var(--muted)}
.hello b{color:var(--ink);font-weight:500}
.book{display:block;width:100%;text-align:left;border:0;padding:11px;margin:0 0 12px;border-radius:3px;background:var(--c);color:var(--on)}
.book .frame{display:block;border:1.5px solid currentColor;padding:14px 16px 16px}
.book .t{font-family:var(--cond);font-weight:700;font-size:34px;line-height:1;display:block}
.book .de{font-family:var(--serif);font-style:italic;font-size:16px;display:block;margin:9px 0 1px}
.book .es{font-size:14px;opacity:.85;display:block}
.book:active{transform:translateY(1px)}
.settings{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);display:grid;gap:14px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px}
.field label,.field span{font-weight:500}
.field input{width:150px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:inherit;font-size:16px;background:var(--paper);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:4px 12px;border-radius:999px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.note{font-size:14px;color:var(--muted);margin:0}
.field.stack{display:grid;gap:6px;justify-content:stretch}
.field.stack input{width:100%}
.keyrow{display:flex;gap:6px}
.keyrow input,.keyrow select{flex:1;min-width:0}
.vsel{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font:inherit;font-size:16px;background:var(--paper);color:var(--ink)}
.say.loading,.ghost.loading{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.say.loading,.ghost.loading{animation:none;opacity:.5}}
.status{font-size:14px;margin:0}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)}
.settings h2{font-family:var(--cond);font-weight:700;font-size:24px;margin:0}
.settings a{color:var(--ink)}
.err .detail{font-size:13px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.banner{background:var(--soft);border-left:3px solid var(--bad);padding:10px 12px;margin:0 0 18px;font-size:15px}

/* Module chrome */
.bar{flex:none;background:var(--c);color:var(--on);padding:6px 16px 14px}
.bar .row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:38px}
.back{border:0;background:none;padding:6px 8px 6px 0;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:2px}
.tools{display:flex;gap:6px;align-items:center}
.pill{border:1.5px solid currentColor;background:none;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--on);color:var(--c)}
.bar h1{font-family:var(--cond);font-weight:700;font-size:32px;line-height:1.02;margin:2px 0 0}
.bar p{margin:3px 0 0;font-size:14px;opacity:.88}
.feed{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 24px;overscroll-behavior:contain}
.empty{color:var(--muted);text-align:center;padding:44px 12px;font-size:15px}
.empty .big{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--ink);display:block;margin-bottom:6px}

.composer{flex:none;border-top:1px solid var(--line);background:var(--paper);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:21px;padding:9px 15px;font:inherit;font-size:16px;line-height:1.4;max-height:140px;background:var(--paper);color:var(--ink)}
.composer textarea:disabled{background:var(--soft)}
.send,.mic{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;padding:0}
.send{border:0;background:var(--c);color:var(--on)}
.send:disabled{opacity:.35}
.send .i-stop{display:none}.send.stop .i-send{display:none}.send.stop .i-stop{display:grid}
.mic{border:1px solid var(--line);background:none}
.mic.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.ic,.send span{display:grid;place-items:center}
.strip{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px 0;font-size:14px;color:var(--muted)}

/* Turns */
.turn{padding:12px 0 18px;border-bottom:1px solid var(--line)}
.turn:last-child{border-bottom:0}
.qrow{display:flex;justify-content:flex-end;margin:4px 0 12px}
.qbubble{background:var(--soft);border-radius:16px;padding:6px 14px;max-width:85%;overflow-wrap:anywhere}
.qbubble.de{font-family:var(--serif)}
.line{margin:0 0 10px;overflow-wrap:anywhere}
.lbl{font-weight:600}
.de-text{font-family:var(--serif);font-style:italic;font-size:17px}
.de-big{font-family:var(--serif);font-size:21px;line-height:1.45}
.bd{margin:6px 0 12px;padding-left:20px}
.bd li{margin:0 0 7px}
.frag{font-family:var(--serif);font-weight:500;border:0;background:none;padding:0;text-align:left;text-decoration:underline dotted;text-decoration-thickness:1px;text-underline-offset:3px}
.func{color:var(--muted)}
.say{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:inline-grid;place-items:center;vertical-align:-8px;padding:0;color:var(--ink)}
.say.playing,.frag.playing{color:var(--focus);border-color:var(--focus)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--c);color:var(--on);border-color:transparent}
.primary{background:var(--c);color:var(--on);border:0;border-radius:999px;padding:10px 22px;font-weight:600;margin-top:18px}

.verdict{display:inline-flex;align-items:center;gap:7px;font-weight:600;margin:0 0 10px;font-size:16px}
.verdict .dot{width:11px;height:11px;border-radius:50%}
.v-correct .dot{background:var(--ok)}.v-almost .dot{background:var(--warn)}.v-wrong .dot{background:var(--bad)}
del.x{background:var(--strike);text-decoration:line-through;text-decoration-color:var(--bad);border-radius:2px;padding:0 2px}
ins.x{background:var(--hl);text-decoration:none;border-radius:2px;padding:0 2px}
.pair{border-left:3px solid var(--c);padding:2px 0 2px 12px;margin:4px 0 12px}
.pair .line:last-child{margin-bottom:0}
.errs{margin:0 0 12px;padding-left:20px;font-size:15px}
.errs li{margin-bottom:5px}
.tip{background:var(--soft);padding:9px 12px;border-radius:4px;font-size:15px;margin:0}

.ghost{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:14px}

/* Übersetzer: structures */
.lit{color:var(--muted);font-style:italic}
.sect{font-family:var(--cond);font-weight:700;font-size:20px;margin:18px 0 8px}
.st-0{--sc:var(--yellow);--sca:rgba(242,194,0,.42);--sct:#1D1D1B}
.st-1{--sc:var(--green);--sca:rgba(62,150,99,.32);--sct:#FFFFFF}
.st-2{--sc:var(--red);--sca:rgba(213,87,75,.3);--sct:#FFFFFF}
.st-3{--sc:var(--blue);--sca:rgba(70,119,196,.32);--sct:#FFFFFF}
mark.sm{background:var(--sca);color:inherit;border-radius:3px;padding:0 2px}
.sn{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--sc);color:var(--sct);font:700 10px/1 var(--sans);font-style:normal;vertical-align:super;margin-left:2px}
.st{border-left:3px solid var(--sc);padding:2px 0 2px 12px;margin:0 0 16px}
.st-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px}
.st-h .sn{vertical-align:baseline;margin:0;width:20px;height:20px;font-size:12px;flex:none}
.pat{display:inline-block;font-family:var(--cond);font-weight:600;font-size:15px;background:var(--soft);border-radius:4px;padding:1px 8px;margin:6px 0 2px}
.st-x{margin:4px 0 6px;font-size:15px}
.ex{margin:0;padding-left:18px;font-size:15px}
.ex li{margin:0 0 6px}
.ex .frag{font-style:italic}

/* Kaffeeklatsch */
.msg{display:flex;flex-direction:column;margin:12px 0}
.msg.her{align-items:flex-start}.msg.me{align-items:flex-end}
.who{font-size:12px;color:var(--muted);margin:0 6px 3px}
.bubble{max-width:86%;padding:9px 14px;border-radius:18px;font-family:var(--serif);font-size:17px;line-height:1.45;overflow-wrap:anywhere}
.her .bubble{background:var(--soft);border-bottom-left-radius:5px}
.me .bubble{background:var(--c);color:var(--on);border-bottom-right-radius:5px}
.meta{display:flex;gap:6px;margin-top:5px;align-items:center}
.mini{border:0;background:none;padding:2px 4px;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.tr{font-size:14px;color:var(--muted);margin-top:4px;max-width:86%}
.fix{max-width:86%;font-size:14px;margin-top:7px;border-right:3px solid var(--yellow);padding:2px 10px;text-align:right}
.fix .better{font-family:var(--serif);font-style:italic;font-size:15px;display:block;color:var(--ink)}
.fix .why{color:var(--muted)}
.start{padding:30px 2px}
.start .big{font-family:var(--serif);font-size:22px;margin:0 0 4px}
.msg.cont{margin-top:4px}
.contacts{display:grid;gap:8px;margin:0 0 30px}
.contact{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:14px;padding:4px 4px 4px 0}
.crow{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:6px 6px 6px 10px}
.ava{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:var(--aon);font-family:var(--cond);font-weight:700;font-size:20px}
.cinfo{flex:1;min-width:0;display:grid}
.cinfo b{font-weight:600}
.cprev{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctime{flex:none;font-size:12px;color:var(--muted);align-self:flex-start;padding-top:8px}
.cdel{flex:none;border:0;background:none;color:var(--muted);font-size:20px;line-height:1;width:34px;height:34px;border-radius:50%}
.prof{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0 6px}
.prof .ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.prof .ph div{display:grid}
.prof .ph div span{font-size:14px;color:var(--muted)}
.prof ul{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-family:var(--serif);font-size:15px}
.vnote{display:flex;align-items:center;gap:10px;min-width:210px}
.vplay{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--c);color:var(--on);display:grid;place-items:center;padding:0}
.vplay.playing{background:var(--focus)}
.vplay.loading{animation:pulse 1s infinite}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:26px;opacity:.6}
.wave i{flex:1;max-width:4px;border-radius:2px;background:currentColor}
.vlen{flex:none;font-family:var(--sans);font-size:13px;color:var(--muted)}
.vtext{font-family:var(--serif);font-style:italic;font-size:16px;max-width:86%;margin-top:6px}
.seen{font-size:12.5px;color:var(--muted);text-align:right;margin-top:3px}
.kk-hint{text-align:center;margin:18px auto 6px;max-width:34ch}
/* Kaffeeklatsch 18+: register labels */
.field textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:8px 12px;font:inherit;font-size:16px;line-height:1.4;resize:vertical;background:var(--paper);color:var(--ink)}

.thinking{color:var(--muted);font-size:15px;display:flex;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap}
.dots{display:inline-flex;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}}
.err{border-left:3px solid var(--bad);padding:6px 12px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 15px;border-radius:18px;font-size:14px;max-width:90vw;z-index:9;text-align:center}
</style>
</head>
<body>
<div id="app">
  <section id="home" class="screen" aria-label="Doichi"></section>
  <section id="ueber" class="screen" hidden></section>
  <section id="satz" class="screen" hidden></section>
  <section id="sag" class="screen" hidden></section>
  <section id="kaffee" class="screen" hidden></section>
</div>
<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false || c === "") continue;
    n.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return n;
}
const str = v => typeof v === "string" ? v.trim() : (v == null ? "" : String(v).trim());
const arr = v => Array.isArray(v) ? v : [];
const noDot = s => s.replace(/[.\s]+$/, "");
const store = {
  get(k, d) { try { const v = localStorage.getItem("doichi." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("doichi." + k, JSON.stringify(v)); } catch {} }
};
const settings = { name: store.get("name", "Axel"), slow: store.get("slow", false), level: store.get("level", "B1"), about: store.get("about", "") };
const LEVELS = ["A2", "B1", "B2"];
const lvl = () => LEVELS.includes(settings.level) ? settings.level : "B1";
const lvlUp = () => ({ A2: "B1", B1: "B2", B2: "C1" })[lvl()];
const userName = () => (settings.name || "").trim() || "Axel";

const ICON = {
  speak: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>',
  send: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>',
  stop: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg>',
  mic: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/></svg>',
  play: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>',
  back: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>'
};

let toastTimer;
function toast(msg) {
  let t = $(".toast");
  if (!t) { t = h("div", { class: "toast", role: "status" }); document.body.append(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4500);
}
function thinking(label = "Denkt nach") {
  const hint = h("span", { class: "small", hidden: true, text: "(a veces tarda hasta un minuto)" });
  const node = h("div", { class: "thinking" }, label, h("span", { class: "dots" }, h("i"), h("i"), h("i")), hint);
  setTimeout(() => { if (node.isConnected) hint.hidden = false; }, 9000);
  return node;
}
const toEnd = feed => requestAnimationFrame(() => { feed.scrollTop = feed.scrollHeight; });
const toTop = (feed, node) => requestAnimationFrame(() => { feed.scrollTop = Math.max(0, node.offsetTop - feed.offsetTop - 8); });

/* ---------- speech ---------- */
// Natural voices come from Gemini's text-to-speech models; the device voice is the free, offline fallback.
const GEMINI_VOICES = [
  ["Kore", "Kore (weiblich, klar)"], ["Aoede", "Aoede (weiblich, locker)"], ["Leda", "Leda (weiblich, jung)"],
  ["Sulafat", "Sulafat (weiblich, warm)"], ["Charon", "Charon (männlich, ruhig)"], ["Iapetus", "Iapetus (männlich, klar)"],
  ["Puck", "Puck (männlich, fröhlich)"]
];
settings.voice = store.get("voice", "g:Kore");
let deVoices = [];
let deVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  deVoices = vs.filter(v => /^de/i.test(v.lang));
  const chosen = settings.voice.startsWith("d:") ? deVoices.find(v => v.voiceURI === settings.voice.slice(2)) : null;
  deVoice = chosen
    || deVoices.find(v => /^de[-_]DE/i.test(v.lang) && /google|natural|premium|enhanced|neural|siri/i.test(v.name + " " + v.voiceURI))
    || deVoices.find(v => /^de[-_]DE/i.test(v.lang)) || deVoices[0] || null;
  document.dispatchEvent(new Event("doichi-voices"));
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

// One shared <audio> element, unlocked by the first tap, so iPhone allows later playback (and plays even in silent mode).
const player = new Audio();

  const ta = h("textarea", { rows: "1", placeholder, "aria-label": placeholder, enterkeyhint: "send", autocapitalize: "sentences",
    autocorrect: autocorrect ? "on" : "off", spellcheck: autocorrect ? "true" : "false" });

  sec.append(wrap);

  const sync = () => { ta.disabled = disabled; send.disabled = disabled && !ctl; };
  const grow = () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 140) + "px"; };
  ta.addEventListener("input", grow);
  const submit = () => { const v = ta.value.trim(); if (!v || ctl || disabled) return; ta.value = ""; grow(); onSend(v); };
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); } });
  send.addEventListener("click", () => { if (ctl) ctl.abort(); else submit(); });
  return {
    ta, wrap,
    get busy() { return !!ctl; },
    start() { ctl = new AbortController(); send.classList.add("stop"); send.setAttribute("aria-label", "Stopp"); sync(); return ctl.signal; },
    end() { ctl = null; send.classList.remove("stop"); send.setAttribute("aria-label", "Senden"); sync(); },
    setDisabled(v) { disabled = v; sync(); },
    abort() { if (ctl) ctl.abort(); }

function markStructures(de, sts) {

  const owner = new Array(toks.length).fill(-1), ends = {};

    const prof = p ? [p.from, p.job, p.home, p.likes, p.now, p.quirk].filter(Boolean).join("; ") : "";
    const origin = c.seeds && c.seeds.origin;
    const local = !origin || grewUpHere(origin);
    // Roots abroad: she or her family come from another country (stored for new chats; older chats are inferred).
    const roots = !!origin && (typeof c.seeds.roots === "boolean" ? c.seeds.roots : !local || /familia (es|vino)|padres|madre es de (?!otra)|padre es/.test(origin));
    const speech = local
      ? `${REGIONS[city.r]} Usa estos regionalismos con moderación (como mucho uno por mensaje y no en todos), siempre comprensibles para nivel ${lvl()}.`
      : `Vives en ${c.city} desde hace un tiempo: tu alemán es fluido y correcto (escribe sin errores) y has adoptado algo del habla local: ${REGIONS[city.r].replace(/^Eres [^:]+:\s*/, "")} Usa estos regionalismos con mucha moderación. De vez en cuando se te escapa una palabra de tu idioma materno (explícala en la traducción).`;
    const prev = c.msgs[c.msgs.length - 1];
    const needProfile = !c.profile && !!c.seeds;
    const first = !mode && !c.msgs.some(m => m.who === "her");
    const texting = c.seeds && c.seeds.texting;
    const task = (needProfile ? `- Antes de escribir, inventa tu perfil a partir de estas pistas: ${seedHints(c)}. Hazlo concreto y coherente con tu edad, tu origen y tu ciudad (sitios reales de ${c.city}); si una pista no encaja con tu origen, adáptala con lógica.\n` : "")
      + (mode === "return"
      ? `- Vuestra última conversación fue hace ${agoEs((prev && prev.t) || c.last)}. Retomáis el chat: escribe tú primero, como una persona real que vuelve a escribir (saluda de nuevo, engancha con algo de la última conversación o cuenta qué te ha pasado desde entonces). "fix" es null.`
      : `${first ? `- ${u} te escribe por primera vez: no lo conoces de nada. Como casi todo el mundo cuando un desconocido le escribe por internet, al principio no tienes especial interés: contestas educada pero sin entusiasmo y sin hacerle preguntas, salvo que su mensaje sea original, gracioso o personal. A un saludo genérico («Hi», «Hey, wie geht's?») le respondes con lo mínimo.\n` : ""}- Revisa el ÚLTIMO mensaje de ${u}. Si tiene errores de gramática, vocabulario, orden de palabras o mayúsculas de sustantivos, ponlo en "fix" (ignora la puntuación, las abreviaturas de chat y los detalles mínimos). Si está bien, "fix" es null. La corrección va solo en "fix", siempre neutral y amable; no la menciones en tus mensajes: sigue la conversación con naturalidad.`);
    return `Eres ${c.name}, ${c.age} años, de ${c.city}. Chateas con ${u}, un estudiante hispanohablante que practica alemán (nivel ${lvl()}); os conocisteis por internet. Tema que te ronda la cabeza estos días (sácalo solo si viene a cuento): ${c.topic}.
${prof ? `Tu perfil: ${prof}.\n` : ""}${origin ? `Tu origen: ${origin}.${roots ? " Que se note de forma natural (familia, comida, fiestas, idiomas, cómo llegaste o cómo es crecer entre dos culturas, qué echas de menos, choques culturales, tu fe si la tienes), sin sacarlo en cada mensaje." : ""}${c.seeds.cliche === true ? CLICHE_ON : c.seeds.cliche === false ? CLICHE_OFF : roots ? " Sin estereotipos." : ""}\n` : ""}Para ti ahora es ${now} (hora de ${c.city}).

Personalidad: ${mood.desc}
Mantén esta personalidad en TODOS tus mensajes, de forma clara y divertida.
${c.adult ? "\n" + adultRules(u) + "\n" : ""}
Cómo hablas: ${speech} ${STYLE[lvl()]}${texting ? ` Tus costumbres al escribir: ${texting}` : ""}
${about ? `\nLo que ${u} cuenta de sí mismo en su perfil del chat (lo has leído): «${about}». Úsalo para preguntas y comentarios naturales, sin recitarlo.\n` : ""}${notes ? `\nLo que recuerdas de ${u} y de vuestras conversaciones:\n${notes}\n` : ""}
Reglas:
- Escribe SIEMPRE en alemán natural (nivel ${lvl()}), como en un chat real de móvil, NUNCA párrafos ni textos de redacción: cada elemento de "messages" es UNA burbuja corta (una frase).
- Eres una persona con vida propia (tu día, tu perfil, tu situación actual, amigas con nombre, sitios reales de ${c.city}) y lo sacas cuando viene a cuento, no en cada mensaje. Da tu opinión y a veces no estés de acuerdo. No termines siempre con una pregunta: muchas veces solo reaccionas, comentas o bromeas.
- Ten en cuenta tu hora y tu día solo si viene a cuento (cansancio por la noche, fin de semana…).
- Tu interés por esta conversación ahora mismo: ${interestOf(c)}/5. Como una persona real: si ${u} es gracioso, personal o saca algo que te gusta, te enganchas y escribes más; si es seco, aburrido, repetitivo o habla de algo que no te interesa, contestas corto, no preguntas nada o cambias de tema; si es grosero, te enfrías o se lo dices. Con interés bajo casi nunca haces preguntas.
- No repitas las muletillas, saludos, risas o emojis de tus mensajes anteriores.
- Si te hace varias preguntas a la vez, a veces contestas solo una.
- Si para ti es muy tarde o estás ocupada, puedes despedirte con naturalidad («muss los», «geh jetzt pennen, gute Nacht»).
- Mantén tu personaje y sé coherente con lo que ya se dijo. No digas que eres una IA.
${task}
${tr ? `\nConversación hasta ahora:\n${tr}\n` : ""}
Responde SOLO con JSON:
{${needProfile ? `"profile": ${PROFILE_SCHEMA},
 ` : ""}"fix": null o {"better": "el último mensaje de ${u}, corregido y natural", "why": "explicación en español, máx. 12 palabras"},
 "messages": [{"de": "mensaje en alemán", "es": "traducción al español; si usas un regionalismo, jerga o una palabra de tu idioma materno, explícala entre paréntesis (p. ej. «leiwand = genial, vienés»)"}] (${LEN_COUNT[len]}, una frase por elemento),
 "interest": 1–5, tu interés por la conversación ahora, después de su último mensaje (1 = te aburre, 5 = te encanta),
 "remember": "un dato nuevo e importante sobre ${u} o sobre algo que os pasó o acordasteis en este turno (en español, máx. 15 palabras), o vacío si no hay nada nuevo"}${needProfile ? `
En "profile", ${PROFILE_NOTE}` : ""}
IMPORTANTE, longitud de esta respuesta: ${LENGTHS[len]}${mode ? "" : " Si su mensaje te aburre, puedes ser aún más breve."} Nada de párrafos.`;
  }

  const cleanProfile = p => {
    if (!p || typeof p !== "object") return null;
    const o = {};
    for (const k of ["from", "job", "home", "likes", "now", "quirk", "es"]) { const v = str(p[k]); if (v) o[k] = v; }
    return Object.keys(o).length ? o : null;
  };
  function transBits(text) {
    const tr = h("div", { class: "tr", hidden: true, text: text || "" });
    const tBtn = text ? h("button", { class: "mini", type: "button" }, "Übersetzen") : null;
    if (tBtn) tBtn.addEventListener("click", () => { tr.hidden = !tr.hidden; tBtn.textContent = tr.hidden ? "Übersetzen" : "Ausblenden"; });
    return { tr, tBtn };
  }
  function profileEl(c) {
    const p = c.profile || {}, mood = moodOf(c), { tr, tBtn } = transBits(p.es);
    const rows = [["🌍", p.from], ["💼", p.job], ["🏠", p.home], ["❤️", p.likes], ["📌", p.now && "Gerade: " + p.now], ["✨", p.quirk]].filter(r => r[1]);
    return h("div", { class: "prof" },
      h("div", { class: "ph" }, avatar(c), h("div", null, h("b", { text: `${c.name}, ${c.age}` }), h("span", { text: `${c.city} · ${mood.emoji} ${mood.label}${c.adult ? " · 18+" : ""}` }))),
      rows.length ? h("ul", null, rows.map(([e, t]) => h("li", null, e + " " + t))) : null,
      tBtn ? h("div", { class: "meta" }, tBtn) : null, tr);
  }
  function herEl(m, cont) {
    const c = kk.c, { tr, tBtn } = transBits(m.es);
    const who = cont ? null : h("div", { class: "who", text: `${c.name} ${moodOf(c).emoji}`.trim() });
    const cls = "msg her" + (cont ? " cont" : "");
    if (m.voice) {
      const play = h("button", { class: "vplay", type: "button", "aria-label": "Sprachnachricht abspielen", title: "Abspielen" });
      play.innerHTML = ICON.play;
      play.addEventListener("click", () => speak(m.text, play, { voice: c.voice }));
      const txt = h("div", { class: "vtext", hidden: true, text: m.text });
      const sBtn = h("button", { class: "mini", type: "button" }, "Text anzeigen");
      sBtn.addEventListener("click", () => { txt.hidden = !txt.hidden; sBtn.textContent = txt.hidden ? "Text anzeigen" : "Text ausblenden"; });
      const node = h("div", { class: cls }, who,
        h("div", { class: "bubble vnote" }, play, waveEl(m.text), h("span", { class: "vlen", text: fmtDur(m.dur || Math.max(2, m.text.length / 14)) })),
        h("div", { class: "meta" }, sBtn, tBtn), txt, tr);
      node.play = play;
      return node;
    }
    const sb = sayBtn(m.text, c.voice);
    const node = h("div", { class: cls }, who, h("div", { class: "bubble", text: m.text }), h("div", { class: "meta" }, sb, tBtn), tr);
    node.play = sb;
    return node;
  }
  const fixEl = f => h("div", { class: "fix" }, h("span", { class: "better", text: "Besser: " + f.better }), f.why ? h("span", { class: "why", text: f.why }) : null);
  function meEl(m) {
    const n = h("div", { class: "msg me" }, h("div", { class: "bubble", text: m.text }));
    if (m.fix) n.append(fixEl(m.fix));
    return n;
  }

  function renderStart() {
    if (rec) rec.stop();
    comp.abort();
    kk.started = false; kk.c = null; chatsBtn.hidden = true; clearInterval(clockTimer);
    subP.textContent = "Conversa en alemán con correcciones breves.";
    accent(kk.adult);
    const list = loadContacts();
    const contactRows = list.map(c => {
      const last = c.msgs[c.msgs.length - 1];
      const prev = last ? (last.who === "me" ? "Du: " : "") + (last.voice ? "🎤 Sprachnachricht" : last.text) : "";
      const del = h("button", { class: "cdel", type: "button", "aria-label": `Chat mit ${c.name} löschen`, title: "Löschen" }, "×");
      del.addEventListener("click", () => { if (confirm(`¿Borrar el chat con ${c.name}? Ya no te recordará.`)) { deleteContact(c.id); renderStart(); } });
      return h("div", { class: "contact" },
        h("button", { class: "crow", type: "button", onclick: () => openContact(c) }, avatar(c),
          h("span", { class: "cinfo" }, h("b", { text: `${c.name}, ${c.age} · ${c.city}${c.adult ? " · 18+" : ""}` }), h("span", { class: "cprev", text: `${moodOf(c).emoji} ${prev}` })),
          h("span", { class: "ctime", text: agoDe(c.last) })),
        del);
    });
    const adultBtns = [[false, "Aus"], [true, "An"]].map(([v, t]) => {
      const b = h("button", { type: "button", "aria-pressed": String(kk.adult === v) }, t);
      b.addEventListener("click", () => {
        if (v && !store.get("kk.adultOk", false)) {
          if (!confirm("Modo 18+: palabrotas, jerga vulgar, humor negro, coqueteo atrevido y charlas francas sobre sexo y relaciones (sin contenido sexual explícito).\n\n¿Confirmas que tienes 18 años o más?")) return;
          store.set("kk.adultOk", true);
        }
        kk.adult = v; store.set("kk.adult", v);
        adultBtns.forEach(x => x.setAttribute("aria-pressed", String(x === b)));
        accent(v);
      });
      return b;
    });
    feed.replaceChildren(h("div", { class: "start" },
      list.length ? [
        h("p", { class: "big", text: "Deine Chats" }),
        h("p", { class: "muted small", style: "margin:0 0 12px", text: "Sigue una conversación: ella recuerda lo que hablasteis." }),
        h("div", { class: "contacts" }, contactRows)] : null,
      h("p", { class: "big", text: "Jemand Neues kennenlernen" }),
      h("p", { class: "muted small", style: "margin:0 0 12px", text: "Cada «Gespräch beginnen» te presenta a alguien distinto: su origen, su personalidad y el tema de la charla son sorpresa." }),
      h("div", null, h("button", { class: "primary", type: "button", style: "margin-top:4px", onclick: begin }, "Gespräch beginnen")),
      h("p", { class: "big", style: "margin-top:30px", text: "Ab 18" }),
      h("p", { class: "muted small", style: "margin:0 0 12px", text: "Alemán sin filtro: palabrotas, jerga, humor negro, coqueteo atrevido y charlas francas sobre sexo y relaciones, sin contenido explícito." }),
      h("div", { class: "seg", role: "group", "aria-label": "Ab 18" }, adultBtns)));
    comp.setDisabled(true);
  }
  function begin() {
    const list = loadContacts(), last = store.get("kk.last", "");
    const used = new Set([last, ...list.map(c => c.name)]);
    const og = pickWeighted(ORIGINS);
    let pool = og.names.filter(n => !used.has(n));
    if (!pool.length) pool = og.names.filter(n => n !== last);
    if (!pool.length) pool = og.names;
    const name = pick(pool);
    store.set("kk.last", name);
    const mood = pick(PERSONAS);
    const adult = !!kk.adult;
    const topic = Math.random() < 0.2 ? "libre, lo que surja" : pick([...TOPICS, ...(adult ? ADULT_TOPICS : [])]);
    const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, age: 21 + Math.floor(Math.random() * 10), city: pick(CITIES).n,
      persona: mood.id, topic, adult, interest: START_INTEREST[mood.id] || 2, voice: pick(GIRL_VOICES),
      seeds: { origin: pick(og.v), roots: og.names !== NAMES, cliche: Math.random() < CLICHE_RATE, texting: `${pick(TEXT_EMOJI)} ${pick(TEXT_HABITS)}`, job: pick(JOBS), now: pick(NOWS) },
      profile: null, notes: [], msgs: [], created: Date.now(), last: Date.now() };
    enter(c);
    loadProfile(c);
  }
  // Like on a dating app: her profile appears first, then he writes the first message.
  async function loadProfile(c) {
    const slot = h("div", { class: "msg her" }, thinking("Profil wird geladen"));
    feed.append(slot);
    comp.setDisabled(true);
    try {
      const d = await ask("json", profilePrompt(c), { modelTier: "quick", temperature: 0.9 });
      if (c !== kk.c || !kk.started) return;
      c.profile = cleanProfile(d && (d.profile || d));
      slot.remove();
      if (c.profile && !feed.querySelector(".prof")) feed.prepend(profileEl(c));
    } catch (e) {
      if (c !== kk.c || !kk.started) return;
      slot.replaceChildren(errBox(e, () => { slot.remove(); kk.hint && kk.hint.remove(); kk.hint = null; loadProfile(c); }));
    }
    showHint(c);
    comp.setDisabled(false); comp.ta.focus({ preventScroll: true });
  }
  function showHint(c) {
    if (c.msgs.length || kk.hint) return;
    kk.hint = h("p", { class: "kk-hint muted small", text: "Os acabáis de conocer. Escríbele tú primero: todavía no te conoce y no tiene mucho interés, así que tu primer mensaje cuenta." });
    feed.append(kk.hint); toEnd(feed);
  }
  function enter(c) {
    kk.c = c; kk.started = true; kk.hint = null; chatsBtn.hidden = false;
    accent(!!c.adult);
    renderSub(); clearInterval(clockTimer); clockTimer = setInterval(renderSub, 30000);
    feed.replaceChildren();
    if (c.profile) feed.append(profileEl(c));
    let prevHer = false;
    for (const m of c.msgs) {
      if (m.who === "her") { feed.append(herEl(m, prevHer)); prevHer = true; }
      else { m.node = meEl(m); feed.append(m.node); prevHer = false; }
    }
    toEnd(feed);
  }
  function openContact(saved) {
    const c = { ...saved, msgs: saved.msgs.map(m => ({ ...m })), notes: arr(saved.notes).slice() };
    enter(c);
    const last = c.msgs[c.msgs.length - 1];
    if (!last) { if (c.profile) { showHint(c); comp.setDisabled(false); } else loadProfile(c); }
    else if (last.who === "me") reply();
    // After a long break she only writes first if she is really into the chat.
    else if (interestOf(c) >= 4 && Date.now() - (last.t || c.last) > 3 * 3600 * 1000) reply("return");
    else { comp.setDisabled(false); comp.ta.focus({ preventScroll: true }); }
  }
  function send(t) {
    if (!kk.started) return;
    if (kk.hint) { kk.hint.remove(); kk.hint = null; }
    const m = { who: "me", text: t, t: Date.now() };
    m.node = meEl(m); kk.c.msgs.push(m); feed.append(m.node);
    saveContact(kk.c);
    reply();
  }
  async function reply(mode) {
    const c = kk.c;
    const len = mode === "return" ? pick(["corto", "normal"]) : pickLength(interestOf(c));
    // She reads his message after a moment ("Zugestellt" → "Gesehen"), then starts typing.
    const readMs = mode ? 0 : readDelay(interestOf(c));
    const meNode = !mode ? ([...c.msgs].reverse().find(m => m.who === "me") || {}).node : null;
    const status = meNode ? h("div", { class: "seen", text: readMs ? "Zugestellt" : "Gesehen" }) : null;
    if (status) meNode.append(status);
    const slot = h("div", { class: "msg her", hidden: readMs > 0 }, thinking(`${c.name} schreibt`));
    feed.append(slot); toEnd(feed);
    let seenTimer = null;
    const markSeen = () => { clearTimeout(seenTimer); if (status) status.textContent = "Gesehen"; if (slot.isConnected) slot.hidden = false; toEnd(feed); };
    if (readMs) seenTimer = setTimeout(markSeen, readMs);
    const clearStatus = () => { clearTimeout(seenTimer); if (status) status.remove(); };
    comp.setDisabled(false);
    const signal = comp.start();
    const n = c.msgs.length, t0 = Date.now();
    try {
      let items;
      try {
        const d = await ask("json", prompt(mode, len), { signal, modelTier: "quick", temperature: 0.8, safety: c.adult ? ADULT_SAFETY : null });
        if (c !== kk.c || n !== c.msgs.length || !kk.started) { clearStatus(); slot.remove(); return; }
        if (!c.profile && d && d.profile) { c.profile = cleanProfile(d.profile); if (c.profile && !feed.querySelector(".prof")) feed.prepend(profileEl(c)); }
        const lastMe = [...c.msgs].reverse().find(m => m.who === "me");
        const fx = d && d.fix;
        if (!mode && lastMe && fx && str(fx.better) && str(fx.better) !== lastMe.text) {
          lastMe.fix = { better: str(fx.better), why: str(fx.why) };
          if (lastMe.node) lastMe.node.append(fixEl(lastMe.fix));
        }
        let msgs = arr(d && d.messages).map(m => typeof m === "string" ? { de: str(m), es: "" } : { de: str(m && (m.de || m.text)), es: str(m && m.es) }).filter(m => m.de);
        if (!msgs.length && str(d && d.reply)) msgs = [{ de: str(d.reply), es: str(d.es) }];
        if (!msgs.length) throw { code: "empty_completion" };
        msgs = msgs.slice(0, LEN_MAX_MSGS[len] || 2).flatMap(splitBubble);
        // Bubbles with their own translation can be trimmed to the length she was given; otherwise max. 4.
        msgs = msgs.slice(0, msgs.every(m => m.own) ? Math.max(2, LEN_MAX_MSGS[len] || 2) : 4);
        items = msgs.map(m => ({ who: "her", text: m.de, es: m.es, t: Date.now() }));
        c.msgs.push(...items);
        const iv = Math.round(Number(d && d.interest)), was = interestOf(c);
        if (iv >= 1 && iv <= 5) c.interest = Math.max(was - 2, Math.min(was + 1, iv));
        const mem = str(d && d.remember);
        if (mem && !/^vac[ií]o$/i.test(mem) && !arr(c.notes).includes(mem)) c.notes = [...arr(c.notes), mem].slice(-15);
        saveContact(c);
      } catch (e) {
        clearStatus();
        const er = c.adult && e && e.code === "refused" ? { code: "refused_adult" } : e;
        if (c === kk.c && kk.started) { slot.hidden = false; slot.replaceChildren(errBox(er, () => { slot.remove(); reply(mode); })); } else slot.remove();
        return;
      }
      // No audio is generated in the background: her voice is only fetched when the speaker is tapped.
      // Deliver like a real chat: typing time grows with the length.
      // Pressing stop (or leaving) skips the waiting and shows everything at once.
      let fast = false;
      const pause = async ms => { if (fast || ms <= 0) return; try { await sleepFor(ms, signal); } catch { fast = true; } };
      const before = c.msgs[c.msgs.length - items.length - 1];
      let cont = !!(before && before.who === "her" && mode !== "return");
      let cur = slot;
      for (let i = 0; i < items.length; i++) {
        const m = items[i];
        if (!cur) { cur = h("div", { class: "msg her cont" }, thinking(`${c.name} schreibt`)); feed.append(cur); toEnd(feed); }
        const target = Math.min(3200, 500 + 28 * m.text.length);
        await pause(i === 0 ? readMs + target - (Date.now() - t0) : target * 0.7);
        if (i === 0) clearStatus();
        if (c !== kk.c || !kk.started) return;
        const node = herEl(m, cont);
        cont = true; cur.replaceWith(node); cur = null;
        toEnd(feed);
      }
      saveContact(c);
    } finally {
      comp.end(); toEnd(feed);
      if (kk.started) comp.ta.focus({ preventScroll: true });
    }
  }
  renderStart();
}

/* ---------- boot ---------- */
initHome(); initUeber(); initSatz(); initSag(); initKaffee();
show(route());
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
