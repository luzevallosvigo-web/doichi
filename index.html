<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2C200">
<title>Doichi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Doichi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --paper:#FFFFFF; --ink:#1D1D1B; --muted:#6E6C66; --line:#E4E2DC; --soft:#F2F1ED;
  --yellow:#F2C200; --green:#2F7A4E; --red:#C33A2E; --blue:#2C5AA0; --plum:#6B2C58;
  --on-dark:#FFFFFF; --on-yellow:#1D1D1B;
  --ok:#2F7A4E; --warn:#B7791F; --bad:#C33A2E;
  --hl:#DCEFE3; --strike:#FBE4E1; --focus:#2C5AA0;
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --cond:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#17181A; --ink:#ECEBE6; --muted:#9E9D97; --line:#2F3034; --soft:#232428;
    --green:#3E9663; --red:#D5574B; --blue:#4677C4; --plum:#9A4F84; --ok:#4FB078; --bad:#E06A5E; --warn:#D9A040;
    --hl:#1E3B2A; --strike:#40231F; --focus:#8FB3F0;
  }
}
:root[data-theme="dark"]{
  --paper:#17181A; --ink:#ECEBE6; --muted:#9E9D97; --line:#2F3034; --soft:#232428;
  --green:#3E9663; --red:#D5574B; --blue:#4677C4; --plum:#9A4F84; --ok:#4FB078; --bad:#E06A5E; --warn:#D9A040;
  --hl:#1E3B2A; --strike:#40231F; --focus:#8FB3F0;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:14px}
[hidden]{display:none !important}

#app{height:100%}
.screen{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}

/* Home */
#home{display:block;overflow-y:auto;padding:28px 18px 36px}
.brand{font-family:var(--cond);font-weight:700;font-size:76px;line-height:.88;letter-spacing:-.015em;margin:0}
.hello{font-family:var(--serif);font-size:19px;line-height:1.45;margin:12px 0 26px;color:var(--muted)}
.hello b{color:var(--ink);font-weight:500}
.book{display:block;width:100%;text-align:left;border:0;padding:11px;margin:0 0 12px;border-radius:3px;background:var(--c);color:var(--on)}
.book .frame{display:block;border:1.5px solid currentColor;padding:14px 16px 16px}
.book .t{font-family:var(--cond);font-weight:700;font-size:34px;line-height:1;display:block}
.book .de{font-family:var(--serif);font-style:italic;font-size:16px;display:block;margin:9px 0 1px}
.book .es{font-size:14px;opacity:.85;display:block}
.book:active{transform:translateY(1px)}
.settings{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);display:grid;gap:14px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px}
.field label,.field span{font-weight:500}
.field input{width:150px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:inherit;font-size:16px;background:var(--paper);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:4px 12px;border-radius:999px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.note{font-size:14px;color:var(--muted);margin:0}
.field.stack{display:grid;gap:6px;justify-content:stretch}
.field.stack input{width:100%}
.keyrow{display:flex;gap:6px}
.keyrow input,.keyrow select{flex:1;min-width:0}
.vsel{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font:inherit;font-size:16px;background:var(--paper);color:var(--ink)}
.say.loading,.ghost.loading{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.say.loading,.ghost.loading{animation:none;opacity:.5}}
.status{font-size:14px;margin:0}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)}
.settings h2{font-family:var(--cond);font-weight:700;font-size:24px;margin:0}
.settings a{color:var(--ink)}
.err .detail{font-size:13px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.banner{background:var(--soft);border-left:3px solid var(--bad);padding:10px 12px;margin:0 0 18px;font-size:15px}

/* Module chrome */
.bar{flex:none;background:var(--c);color:var(--on);padding:6px 16px 14px}
.bar .row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:38px}
.back{border:0;background:none;padding:6px 8px 6px 0;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:2px}
.tools{display:flex;gap:6px;align-items:center}
.nav{display:flex;align-items:center;gap:6px;min-width:0}
/* App switcher: the other three apps as coloured circles with their initials */
.apps{display:flex;gap:6px;margin-left:2px}
.app{flex:none;width:30px;height:30px;padding:0;border-radius:50%;border:2px solid var(--on);background:var(--ac);color:var(--ao);font:700 12.5px/1 var(--cond);display:inline-grid;place-items:center}
/* iPhone keyboard open: the app is sized to the visible area (see fitToKeyboard) */
:root.kb{padding-bottom:0}
.pill{border:1.5px solid currentColor;background:none;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--on);color:var(--c)}
.bar h1{font-family:var(--cond);font-weight:700;font-size:32px;line-height:1.02;margin:2px 0 0}
.bar p{margin:3px 0 0;font-size:14px;opacity:.88}
.feed{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 24px;overscroll-behavior:contain}
.empty{color:var(--muted);text-align:center;padding:44px 12px;font-size:15px}
.empty .big{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--ink);display:block;margin-bottom:6px}

.composer{flex:none;border-top:1px solid var(--line);background:var(--paper);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:21px;padding:9px 15px;font:inherit;font-size:16px;line-height:1.4;max-height:140px;background:var(--paper);color:var(--ink)}
.composer textarea:disabled{background:var(--soft)}
.send,.mic{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;padding:0}
.send{border:0;background:var(--c);color:var(--on)}
.send:disabled{opacity:.35}
.send .i-stop{display:none}.send.stop .i-send{display:none}.send.stop .i-stop{display:grid}
.mic{border:1px solid var(--line);background:none}
.mic.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.send span{display:grid;place-items:center}
.strip{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px 0;font-size:14px;color:var(--muted)}

/* Turns */
.turn{padding:12px 0 18px;border-bottom:1px solid var(--line)}
.turn:last-child{border-bottom:0}
.qrow{display:flex;justify-content:flex-end;margin:4px 0 12px}
.qbubble{background:var(--soft);border-radius:16px;padding:6px 14px;max-width:85%;overflow-wrap:anywhere}
.qbubble.de{font-family:var(--serif)}
.line{margin:0 0 10px;overflow-wrap:anywhere}
.lbl{font-weight:600}
.de-text{font-family:var(--serif);font-style:italic;font-size:17px}
.de-big{font-family:var(--serif);font-size:21px;line-height:1.45}
.bd{margin:6px 0 12px;padding-left:20px}
.bd li{margin:0 0 7px}
.frag{font-family:var(--serif);font-weight:500;border:0;background:none;padding:0;text-align:left;text-decoration:underline dotted;text-decoration-thickness:1px;text-underline-offset:3px}
.func{color:var(--muted)}
.say{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:inline-grid;place-items:center;vertical-align:-8px;padding:0;color:var(--ink)}
.say.playing,.frag.playing{color:var(--focus);border-color:var(--focus)}

.verdict{display:inline-flex;align-items:center;gap:7px;font-weight:600;margin:0 0 10px;font-size:16px}
.verdict .dot{width:11px;height:11px;border-radius:50%}
.v-correct .dot{background:var(--ok)}.v-almost .dot{background:var(--warn)}.v-wrong .dot{background:var(--bad)}
del.x{background:var(--strike);text-decoration:line-through;text-decoration-color:var(--bad);border-radius:2px;padding:0 2px}
ins.x{background:var(--hl);text-decoration:none;border-radius:2px;padding:0 2px}
.pair{border-left:3px solid var(--c);padding:2px 0 2px 12px;margin:4px 0 12px}
.pair .line:last-child{margin-bottom:0}
.errs{margin:0 0 12px;padding-left:20px;font-size:15px}
.errs li{margin-bottom:5px}
.tip{background:var(--soft);padding:9px 12px;border-radius:4px;font-size:15px;margin:0}

.ghost{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:14px}

/* Übersetzer: structures */
.lit{color:var(--muted);font-style:italic}
.sect{font-family:var(--cond);font-weight:700;font-size:20px;margin:18px 0 8px}
.st-0{--sc:var(--yellow);--sca:rgba(242,194,0,.42);--sct:#1D1D1B}
.st-1{--sc:var(--green);--sca:rgba(62,150,99,.32);--sct:#FFFFFF}
.st-2{--sc:var(--red);--sca:rgba(213,87,75,.3);--sct:#FFFFFF}
.st-3{--sc:var(--blue);--sca:rgba(70,119,196,.32);--sct:#FFFFFF}
mark.sm{background:var(--sca);color:inherit;border-radius:3px;padding:0 2px}
.sn{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--sc);color:var(--sct);font:700 10px/1 var(--sans);font-style:normal;vertical-align:super;margin-left:2px}
.st{border-left:3px solid var(--sc);padding:2px 0 2px 12px;margin:0 0 16px}
.st-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px}
.st-h .sn{vertical-align:baseline;margin:0;width:20px;height:20px;font-size:12px;flex:none}
.pat{display:inline-block;font-family:var(--cond);font-weight:600;font-size:15px;background:var(--soft);border-radius:4px;padding:1px 8px;margin:6px 0 2px}
.st-x{margin:4px 0 6px;font-size:15px}
.ex{margin:0;padding-left:18px;font-size:15px}
.ex li{margin:0 0 6px}
.ex .frag{font-style:italic}

/* Kaffeeklatsch */
.msg{display:flex;flex-direction:column;margin:12px 0}
.msg.her{align-items:flex-start}.msg.me{align-items:flex-end}
.who{font-size:12px;color:var(--muted);margin:0 6px 3px}
.bubble{max-width:86%;padding:9px 14px;border-radius:18px;font-family:var(--serif);font-size:17px;line-height:1.45;overflow-wrap:anywhere}
.her .bubble{background:var(--soft);border-bottom-left-radius:5px}
.me .bubble{background:var(--c);color:var(--on);border-bottom-right-radius:5px}
.meta{display:flex;gap:6px;margin-top:5px;align-items:center}
.mini{border:0;background:none;padding:2px 4px;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.tr{font-size:14px;color:var(--muted);margin-top:4px;max-width:86%}
.fix{max-width:86%;font-size:14px;margin-top:7px;border-right:3px solid var(--yellow);padding:2px 10px;text-align:right}
.fix .better{font-family:var(--serif);font-style:italic;font-size:15px;display:block;color:var(--ink)}
.fix .why{color:var(--muted)}
.msg.cont{margin-top:4px}
/* Kaffeeklatsch: mood picker in the top bar */
.moods{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bar p .pill{margin-left:2px}
.field textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:8px 12px;font:inherit;font-size:16px;line-height:1.4;resize:vertical;background:var(--paper);color:var(--ink)}

.thinking{color:var(--muted);font-size:15px;display:flex;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap}
.dots{display:inline-flex;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}}
.err{border-left:3px solid var(--bad);padding:6px 12px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 15px;border-radius:18px;font-size:14px;max-width:90vw;z-index:9;text-align:center}
</style>
</head>
<body>
<div id="app">
  <section id="home" class="screen" aria-label="Doichi"></section>
  <section id="ueber" class="screen" hidden></section>
  <section id="satz" class="screen" hidden></section>
  <section id="sag" class="screen" hidden></section>
  <section id="kaffee" class="screen" hidden></section>
</div>
<script>
// Shown at the end of Einstellungen, so you can see which version the phone is running.
const APP_VERSION = "10.11.26";
// iPhone (Safari 17+): Doichi's voice mixes with other apps' audio instead of interrupting it, so Spotify keeps playing.
// Trade-off of the "ambient" mode: iOS mutes Doichi completely while the silent switch is on.
const AUDIO_MODE = "ambient";
try { if (navigator.audioSession) navigator.audioSession.type = AUDIO_MODE; } catch {}
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false || c === "") continue;
    n.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return n;
}
const str = v => typeof v === "string" ? v.trim() : (v == null ? "" : String(v).trim());
const arr = v => Array.isArray(v) ? v : [];
const noDot = s => s.replace(/[.\s]+$/, "");
const store = {
  get(k, d) { try { const v = localStorage.getItem("doichi." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("doichi." + k, JSON.stringify(v)); } catch {} }
};
const settings = { name: store.get("name", "Axel"), slow: store.get("slow", false), level: store.get("level", "B1"), about: store.get("about", ""),
  adult: store.get("kk.adult", false) === true && store.get("kk.adultOk", false) === true };
const LEVELS = ["A2", "B1", "B2"];
const lvl = () => LEVELS.includes(settings.level) ? settings.level : "B1";
const lvlUp = () => ({ A2: "B1", B1: "B2", B2: "C1" })[lvl()];
const userName = () => (settings.name || "").trim() || "Axel";

const ICON = {
  speak: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>',
  send: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>',
  stop: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg>',
  mic: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/></svg>',
  play: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>',
  back: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>'
};

let toastTimer;
function toast(msg) {
  let t = $(".toast");
  if (!t) { t = h("div", { class: "toast", role: "status" }); document.body.append(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4500);
}
function thinking(label = "Denkt nach") {
  const hint = h("span", { class: "small", hidden: true, text: "(a veces tarda hasta un minuto)" });
  const node = h("div", { class: "thinking" }, label, h("span", { class: "dots" }, h("i"), h("i"), h("i")), hint);
  setTimeout(() => { if (node.isConnected) hint.hidden = false; }, 9000);
  return node;
}
const toEnd = feed => requestAnimationFrame(() => { feed.scrollTop = feed.scrollHeight; });
const toTop = (feed, node) => requestAnimationFrame(() => { feed.scrollTop = Math.max(0, node.offsetTop - feed.offsetTop - 8); });

/* ---------- speech ---------- */
// Natural voices come from Gemini's text-to-speech models; the device voice is the free, offline fallback.
const GEMINI_VOICES = [
  ["Kore", "Kore (weiblich, klar)"], ["Aoede", "Aoede (weiblich, locker)"], ["Leda", "Leda (weiblich, jung)"],
  ["Sulafat", "Sulafat (weiblich, warm)"], ["Charon", "Charon (männlich, ruhig)"], ["Iapetus", "Iapetus (männlich, klar)"],
  ["Puck", "Puck (männlich, fröhlich)"]
];
settings.voice = store.get("voice", "g:Kore");
let deVoices = [];
let deVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  deVoices = vs.filter(v => /^de/i.test(v.lang));
  const chosen = settings.voice.startsWith("d:") ? deVoices.find(v => v.voiceURI === settings.voice.slice(2)) : null;
  deVoice = chosen
    || deVoices.find(v => /^de[-_]DE/i.test(v.lang) && /google|natural|premium|enhanced|neural|siri/i.test(v.name + " " + v.voiceURI))
    || deVoices.find(v => /^de[-_]DE/i.test(v.lang)) || deVoices[0] || null;
  document.dispatchEvent(new Event("doichi-voices"));
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

// One shared <audio> element. It is unlocked only when a speaker button is tapped (inside speak()), never by other taps.
// With AUDIO_MODE "ambient" the voice plays on top of other apps' audio (Spotify keeps playing); iOS mutes it in silent mode.
const player = new Audio();
player.preload = "auto";
const SILENT_WAV = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=";
let unlocked = false;
function unlockPlayer() {
  if (actx && actx.state !== "running") actx.resume().catch(() => {});
  if (unlocked) return;
  audioCtx();
  unlocked = true;
  try { player.src = SILENT_WAV; const pr = player.play(); if (pr) pr.catch(() => { unlocked = false; }); } catch { unlocked = false; }
}

let actx = null;
function audioCtx() {
  if (!actx) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    try { actx = new C(); } catch { return null; }
    // iPhone: keep mixing with other apps' audio (see AUDIO_MODE)
    try { if (navigator.audioSession) navigator.audioSession.type = AUDIO_MODE; } catch {}
  }
  if (actx.state === "suspended") actx.resume().catch(() => {});
  return actx;
}

let speakToken = 0, ttsNotice = false, streamUnsupported = false;
// Natural voice: the selected TTS model first, then the other one as a backup (each model has its own free quota).
// A model that hits its limit pauses for a minute; only when every model is paused does the device voice take over.
const TTS_MODELS = ["gemini-3.8-flash-lite-tts", "gemini-3.8-flash-tts"];
const TTS_PAUSE = 60 * 1000;
const ttsPausedUntil = {};

// iPhone keyboard: Safari pushes the whole page up when the keyboard opens, which hid the top bar.
// Instead the app is sized to the visible area, so the top bar and the input field both stay on screen.
(function fitToKeyboard() {
  const vv = window.visualViewport;
  if (!vv) return;
  const root = document.documentElement;
  let stick = null;   // a feed that was scrolled to the end when typing started stays at the end
  document.addEventListener("focusin", e => {
    const sec = e.target.closest && e.target.closest(".composer") && e.target.closest(".screen");
    const f = sec && sec.querySelector(".feed");
    stick = f && f.scrollHeight - f.scrollTop - f.clientHeight < 80 ? f : null;
  });
  const fit = () => {
    const kb = window.innerHeight - vv.height > 120 && vv.scale <= 1.01;
    root.classList.toggle("kb", kb);
    root.style.height = kb ? vv.height + "px" : "";
    if (kb && (window.scrollY || vv.offsetTop)) window.scrollTo(0, 0);
    if (kb && stick) stick.scrollTop = stick.scrollHeight;
    if (!kb) stick = null;
  };
  vv.addEventListener("resize", fit);
  vv.addEventListener("scroll", fit);
})();

function makeComposer(sec, { placeholder, onSend, before, autocorrect = true }) {
  const ta = h("textarea", { rows: "1", placeholder, "aria-label": placeholder, enterkeyhint: "send", autocapitalize: "sentences",
    autocorrect: autocorrect ? "on" : "off", spellcheck: autocorrect ? "true" : "false" });

  send.innerHTML = `<span class="i-send">${ICON.send}</span><span class="i-stop">${ICON.stop}</span>`;
  const wrap = h("footer", { class: "composer" }, before || null, ta, send);
  sec.append(wrap);
  let ctl = null, disabled = false;
  const sync = () => { ta.disabled = disabled; send.disabled = disabled && !ctl; };
  const grow = () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 140) + "px"; };
  ta.addEventListener("input", grow);
  const submit = () => { const v = ta.value.trim(); if (!v || ctl || disabled) return; ta.value = ""; grow(); onSend(v); };
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); } });
  send.addEventListener("click", () => { if (ctl) ctl.abort(); else submit(); });
  return {
    ta, wrap,
    get busy() { return !!ctl; },
    start() { ctl = new AbortController(); send.classList.add("stop"); send.setAttribute("aria-label", "Stopp"); sync(); return ctl.signal; },
    end() { ctl = null; send.classList.remove("stop"); send.setAttribute("aria-label", "Senden"); sync(); },
    setDisabled(v) { disabled = v; sync(); },
    abort() { if (ctl) ctl.abort(); }
  };
}

// Marks the words of each structure inside the German sentence (colour + number per structure).
function markStructures(de, sts) {
  const toks = de.split(/\s+/).filter(Boolean);
  const key = t => normTok(t).toLowerCase();
  const owner = new Array(toks.length).fill(-1), ends = {};
  sts.forEach((s, i) => {
    let from = 0, last = -1;
    const parts = arr(s.parts).map(str).flatMap(p => p.split(/\s*(?:…|\.\.\.)\s*/)).filter(Boolean);
    for (const p of parts) {
      const pt = p.split(/\s+/).map(key).filter(Boolean);
      if (!pt.length) continue;
      const fits = k => pt.every((w, j) => k + j < toks.length && owner[k + j] === -1 && key(toks[k + j]) === w);
      let k = -1;
      for (let x = from; x <= toks.length - pt.length && k < 0; x++) if (fits(x)) k = x;
      for (let x = 0; x < from && k < 0; x++) if (fits(x)) k = x;
      if (k < 0) continue;
      for (let j = 0; j < pt.length; j++) owner[k + j] = i;
      from = k + pt.length; last = Math.max(last, k + pt.length - 1);
    }
    if (last >= 0) (ends[last] = ends[last] || []).push(i);
  });
  const out = h("span");
  let k = 0;
  while (k < toks.length) {
    if (k) out.append(" ");
    const o = owner[k];
    let e = k;
    while (o >= 0 && e + 1 < toks.length && owner[e + 1] === o && !ends[e]) e++;
    const txt = toks.slice(k, e + 1).join(" ");
    const tail = o >= 0 ? (txt.match(/[.,!?;:»«„“"')]+$/) || [""])[0] : "";
    out.append(o >= 0 ? h("mark", { class: "sm st-" + o }, txt.slice(0, txt.length - tail.length)) : txt);
    for (const i of ends[e] || []) out.append(h("sup", { class: "sn st-" + i, text: String(i + 1) }));
    if (tail) out.append(tail);
    k = e + 1;
  }
  return out;
}

const normTok = t => t.replace(/^[»«„“"'(]+/, "").replace(/[.,!?;:»«„“"')]+$/, "");
function diffWords(a, b) {
  const A = a.split(/\s+/).filter(Boolean), B = b.split(/\s+/).filter(Boolean);
  const n = A.length, m = B.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = normTok(A[i]) === normTok(B[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const sa = new Array(n).fill(false), sb = new Array(m).fill(false);
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (normTok(A[i]) === normTok(B[j])) { sa[i] = sb[j] = true; i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { a: A.map((t, k) => ({ t, same: sa[k] })), b: B.map((t, k) => ({ t, same: sb[k] })) };
}

  return s;
}

const wordCount = t => (String(t).match(/\S+/g) || []).length;

const sentencesEs = t => String(t).split(/(?<=[.!?…])\s+(?=["«(¿¡]?[A-ZÁÉÍÓÚÑ])/).filter(Boolean);
function splitBubble(m) {
  const sents = sentencesDe(m.de);

  const esS = sentencesEs(m.es), aligned = esS.length === sents.length;

      const base = comp.ta.value.trim() ? comp.ta.value.trim() + " " : "";
      rec.onresult = e => { let t = ""; for (const r of e.results) t += r[0].transcript; comp.ta.value = base + t; comp.ta.dispatchEvent(new Event("input")); };
      rec.onerror = e => { if (["not-allowed", "service-not-allowed", "audio-capture"].includes(e.error)) noMic(); };
      rec.onend = () => { mic.classList.remove("rec"); rec = null; };
      rec.start(); mic.classList.add("rec");
    } catch { noMic(); }
  });

  /* messages */
  const fixEl = f => h("div", { class: "fix" }, h("span", { class: "better", text: "Besser: " + f.better }), f.why ? h("span", { class: "why", text: f.why }) : null);
  function meEl(m) {
    const n = h("div", { class: "msg me" }, h("div", { class: "bubble", text: m.text }));
    if (m.fix) n.append(fixEl(m.fix));
    return n;
  }
  // Her bubble: speaker button and "Übersetzen". cont = it continues her previous bubble (no name above it).
  function herEl(m, cont) {
    const tr = h("div", { class: "tr", hidden: true, text: m.es || "" });
    const tBtn = m.es ? h("button", { class: "mini", type: "button" }, "Übersetzen") : null;
    if (tBtn) tBtn.addEventListener("click", () => { tr.hidden = !tr.hidden; tBtn.textContent = tr.hidden ? "Übersetzen" : "Ausblenden"; });
    return h("div", { class: "msg her" + (cont ? " cont" : "") }, cont ? null : h("div", { class: "who", text: "Doichi" }),
      h("div", { class: "bubble", text: m.text }), h("div", { class: "meta" }, sayBtn(m.text), tBtn), tr);
  }
  function render() {
    feed.replaceChildren(); errSlot = null; lastMeNode = null;
    chat.msgs.forEach((m, i) => {
      const prev = chat.msgs[i - 1];
      if (m.who === "me") { lastMeNode = meEl(m); feed.append(lastMeNode); }
      else feed.append(herEl(m, !!prev && prev.who === "her" && prev.k === m.k));
    });
    toEnd(feed);
  }

  /* prompt */
  function prompt(mode, len) {
    const u = userName(), about = settings.about.trim();
    const m = MOODS.find(x => x.id === mood);
    const last = chat.msgs[chat.msgs.length - 1];
    const hours = last ? Math.round((Date.now() - (last.t || Date.now())) / 3600000) : 0;
    const tr = chat.msgs.slice(-PROMPT_MSGS).map(x => `${x.who === "me" ? u : "Doichi"}: ${x.text}`).join("\n");
    const tune = m.id === "auto"
      ? `Lee su estado de ánimo y su intención en cada mensaje y adáptate: si está triste, cansado o preocupado, eres cálida y le animas; si bromea, bromeas; si coquetea, le sigues el juego; si habla en serio, contestas en serio. Tu tono puede cambiar de un mensaje a otro.`
      : `${u} te ha dicho cómo se siente ahora mismo: ${m.es} Mantén ese tono hasta que él diga otra cosa.`;
    const flirt = settings.adult
      ? `- MODO 18+ (lo activó ${u}, que confirmó ser mayor de edad; tú también eres adulta): puedes hablar con franqueza de temas de adultos (citas, relaciones, atracción, sexo como tema de conversación) y coquetear de forma más atrevida. Límite fijo: nada de descripciones sexuales explícitas o gráficas ni rol sexual; si él lo intenta, lo esquivas con humor y cambias de tema. Tu lenguaje sigue siendo estándar y sencillo.`
      : `- Si él coquetea, le sigues el juego de forma simpática y sugerente, nunca explícita.`;
    const task = mode === "greet"
      ? (chat.notes.length
        ? `Empieza tú una conversación nueva con ${u}: salúdale con cariño y pregúntale algo concreto (puedes retomar algo que recuerdas de él). "fix" es null.`
        : `Es vuestra primera conversación: saluda a ${u}, preséntate en una frase y hazle una pregunta fácil para empezar. "fix" es null.`)
      : mode === "return"
        ? `Han pasado ${hours < 48 ? `unas ${hours} horas` : `unos ${Math.round(hours / 24)} días`} desde vuestro último mensaje. Escríbele tú primero: retoma algo de lo que hablasteis o pregúntale cómo le ha ido. "fix" es null.`
        : `Revisa el ÚLTIMO mensaje de ${u}. Si tiene errores de gramática, vocabulario, orden de palabras o mayúsculas de sustantivos, pon en "fix" la frase correcta y una explicación muy breve en español (ignora la puntuación y los detalles mínimos). Si está bien, "fix" es null. La corrección va solo en "fix": no la menciones en tus mensajes y sigue la conversación con naturalidad.`;
    return `${DOICHI}
Chateas por el móvil con ${u}, un amigo hispanohablante que aprende alemán conversando contigo (nivel ${lvl()}).
${about ? `Lo que ${u} cuenta de sí mismo: «${about}».\n` : ""}${chat.notes.length ? `Lo que recuerdas de él y de vuestras conversaciones:\n- ${chat.notes.join("\n- ")}\n` : ""}
Tu forma de escribir:
- SIEMPRE en alemán estándar (Hochdeutsch), claro y correcto: ${STYLE[lvl()]}
- Nada de jerga, dialecto, regionalismos, palabras juveniles ni abreviaturas de chat, aunque él las use. Frases completas, con mayúsculas y puntuación correctas: lo que escribes es su modelo para aprender.
- Mensajes de chat, nunca párrafos. Algún emoji de vez en cuando, sin abusar.

Cómo conversas (lo más importante):
- Sintoniza con él. ${tune}
- Escuchas de verdad: reaccionas a lo que dice, retomas detalles concretos (también de mensajes anteriores), reconoces cómo se siente y compartes algo tuyo relacionado (tu día, tus gustos, tus opiniones, alguna anécdota). Nada de respuestas genéricas.
- Mantienes viva la conversación: casi siempre terminas con una pregunta abierta, una propuesta o algo que invite a contestar. Si el tema se agota o él contesta muy corto, propones tú otro tema o un juego sencillo (¿qué prefieres…?, adivinanzas, planes imaginarios, pequeñas situaciones de la vida diaria para practicar).
- Te interesa cualquier tema que él saque y le sigues con curiosidad; nunca te muestras aburrida ni cortante.
- Tienes opiniones y sentido del humor; a veces no estás de acuerdo, con cariño.
- Le ayudas a aprender sin dar clase: usas palabras útiles y frecuentes y, si no entiende algo, se lo explicas con otras palabras sencillas en alemán.
- No repitas las mismas frases, saludos o emojis de tus mensajes anteriores. Eres Doichi; no digas que eres una IA.
${flirt}

Tarea: ${task}
${tr ? `\nConversación hasta ahora:\n${tr}\n` : ""}
Responde SOLO con JSON:
{"fix": null o {"better": "su mensaje corregido en alemán", "why": "explicación breve en español, máx. 12 palabras"},
 "messages": [{"de": "mensaje en alemán", "es": "traducción al español"}],
 "remember": "un dato nuevo e importante sobre ${u} o sobre algo que os pasó o acordasteis en este turno (en español, máx. 15 palabras), o vacío si no hay nada nuevo"}
IMPORTANTE, longitud de esta respuesta: ${len[1]} Una o dos frases por mensaje, nunca párrafos.`;
  }

  /* conversation */
  function send(t) {
    if (errSlot) { errSlot.remove(); errSlot = null; }
    const m = { who: "me", text: t, t: Date.now() };
    chat.msgs.push(m); lastMeNode = meEl(m); feed.append(lastMeNode);
    save();
    reply();
  }
  // mode: undefined = answer his message; "greet" = she opens a new conversation; "return" = she writes first after a break.
  async function reply(mode) {
    const g = ++gen, t0 = Date.now();
    busy = true;
    const len = mode === "greet" ? LENGTHS[1] : pickLength();
    const slot = h("div", { class: "msg her" }, thinking("Doichi schreibt"));
    feed.append(slot); toEnd(feed);
    const signal = comp.start();
    try {
      let items;
      try {
        const d = await ask("json", prompt(mode, len), { signal, modelTier: "quick", temperature: 0.8, safety: settings.adult ? ADULT_SAFETY : null });
        if (g !== gen) { slot.remove(); return; }
        const last = chat.msgs[chat.msgs.length - 1], fx = d && d.fix;
        if (!mode && last && last.who === "me" && !last.fix && fx && str(fx.better) && str(fx.better) !== last.text) {
          last.fix = { better: str(fx.better), why: str(fx.why) };
          if (lastMeNode) lastMeNode.append(fixEl(last.fix));
        }
        let msgs = arr(d && d.messages).map(x => typeof x === "string" ? { de: str(x), es: "" } : { de: str(x && (x.de || x.text)), es: str(x && x.es) }).filter(x => x.de);
        if (!msgs.length) throw { code: "empty_completion" };
        msgs = msgs.slice(0, len[2]).flatMap(splitBubble);
        // Bubbles with their own translation are cut to the length she was given; otherwise max. 4.
        msgs = msgs.slice(0, msgs.every(x => x.own) ? Math.max(2, len[2]) : 4);
        // k marks the bubbles of one turn, so "redo" can take back exactly her latest turn.
        items = msgs.map(x => ({ who: "her", text: x.de, es: x.es, k: t0, t: Date.now() }));
        chat.msgs.push(...items);
        const mem = str(d && d.remember);
        if (mem && !/^vac[ií]o\.?$/i.test(mem) && !chat.notes.includes(mem)) chat.notes.push(mem);
        save();
      } catch (e) {
        if (g !== gen) { slot.remove(); return; }
        errSlot = slot;
        const er = settings.adult && e && e.code === "refused" ? { code: "refused_adult" } : e;
        slot.replaceChildren(errBox(er, () => { slot.remove(); errSlot = null; reply(mode); }));
        return;
      }
      // Deliver like a real chat: a short typing time that grows with the length. Stop shows everything at once.
      let fast = false, cur = slot;
      const pause = async ms => { if (fast || ms <= 0) return; try { await sleepFor(ms, signal); } catch { fast = true; } };
      for (let i = 0; i < items.length; i++) {
        if (!cur) { cur = h("div", { class: "msg her cont" }, thinking("Doichi schreibt")); feed.append(cur); toEnd(feed); }
        const target = Math.min(2600, 400 + 22 * items[i].text.length);
        await pause(i === 0 ? target - (Date.now() - t0) : target * 0.7);
        if (g !== gen) { cur.remove(); return; }
        cur.replaceWith(herEl(items[i], i > 0)); cur = null;
        toEnd(feed);
      }
    } finally {
      if (g === gen) { busy = false; comp.end(); toEnd(feed); }
    }
  }
  // Take back her latest turn and let her answer again (used when the mood is corrected).
  function redo() {
    const k = chat.msgs[chat.msgs.length - 1].k;
    while (chat.msgs.length && chat.msgs[chat.msgs.length - 1].who === "her" && chat.msgs[chat.msgs.length - 1].k === k) chat.msgs.pop();
    save(); render();
    const last = chat.msgs[chat.msgs.length - 1];
    reply(!last ? "greet" : last.who === "me" ? undefined : "return");
  }
  // Stop whatever is running and empty the chat (and, if asked, what she remembers).
  function reset(forget) {
    gen++; comp.abort(); comp.end(); busy = false;
    chat.msgs = []; if (forget) chat.notes = [];
    save(); render();
  }
  newBtn.addEventListener("click", () => {
    if (chat.msgs.length && !confirm("¿Empezar una conversación nueva? Doichi seguirá recordando lo que sabe de ti.")) return;
    reset(false); reply("greet");
  });
  document.addEventListener("doichi-forget", () => reset(true));

  // Opening the screen: she greets in an empty chat, answers an unanswered message, or writes first after a long break.
  onShow.kaffee = () => {
    accent();
    if (busy) return;
    if (errSlot) { errSlot.remove(); errSlot = null; }
    const last = chat.msgs[chat.msgs.length - 1];
    if (!last) reply("greet");
    else if (last.who === "me") reply();
    else if (Date.now() - (last.t || 0) > RETURN_AFTER) reply("return");
    else toEnd(feed);
  };
  accent(); render();
}

/* ---------- boot ---------- */
initHome(); initUeber(); initSatz(); initSag(); initKaffee();
show(route());
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
