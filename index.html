<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2C200">
<title>Doichi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Doichi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --paper:#FFFFFF; --ink:#1D1D1B; --muted:#6E6C66; --line:#E4E2DC; --soft:#F2F1ED;
  --yellow:#F2C200; --green:#2F7A4E; --red:#C33A2E; --blue:#2C5AA0; --plum:#6B2C58;
  --on-dark:#FFFFFF; --on-yellow:#1D1D1B;
  --ok:#2F7A4E; --warn:#B7791F; --bad:#C33A2E;
  --hl:#DCEFE3; --strike:#FBE4E1; --focus:#2C5AA0;
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --cond:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#17181A; --ink:#ECEBE6; --muted:#9E9D97; --line:#2F3034; --soft:#232428;
    --green:#3E9663; --red:#D5574B; --blue:#4677C4; --plum:#9A4F84; --ok:#4FB078; --bad:#E06A5E; --warn:#D9A040;
    --hl:#1E3B2A; --strike:#40231F; --focus:#8FB3F0;
  }
}
:root[data-theme="dark"]{
  --paper:#17181A; --ink:#ECEBE6; --muted:#9E9D97; --line:#2F3034; --soft:#232428;
  --green:#3E9663; --red:#D5574B; --blue:#4677C4; --plum:#9A4F84; --ok:#4FB078; --bad:#E06A5E; --warn:#D9A040;
  --hl:#1E3B2A; --strike:#40231F; --focus:#8FB3F0;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:14px}
[hidden]{display:none !important}

#app{height:100%}
.screen{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}

/* Home */
#home{display:block;overflow-y:auto;padding:28px 18px 36px}
.brand{font-family:var(--cond);font-weight:700;font-size:76px;line-height:.88;letter-spacing:-.015em;margin:0}
.hello{font-family:var(--serif);font-size:19px;line-height:1.45;margin:12px 0 26px;color:var(--muted)}
.hello b{color:var(--ink);font-weight:500}
.book{display:block;width:100%;text-align:left;border:0;padding:11px;margin:0 0 12px;border-radius:3px;background:var(--c);color:var(--on)}
.book .frame{display:block;border:1.5px solid currentColor;padding:14px 16px 16px}
.book .t{font-family:var(--cond);font-weight:700;font-size:34px;line-height:1;display:block}
.book .de{font-family:var(--serif);font-style:italic;font-size:16px;display:block;margin:9px 0 1px}
.book .es{font-size:14px;opacity:.85;display:block}
.book:active{transform:translateY(1px)}
.settings{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);display:grid;gap:14px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px}
.field label,.field span{font-weight:500}
.field input{width:150px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:inherit;font-size:16px;background:var(--paper);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:4px 12px;border-radius:999px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.note{font-size:14px;color:var(--muted);margin:0}
.field.stack{display:grid;gap:6px;justify-content:stretch}
.field.stack input{width:100%}
.keyrow{display:flex;gap:6px}
.keyrow input,.keyrow select{flex:1;min-width:0}
.vsel{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font:inherit;font-size:16px;background:var(--paper);color:var(--ink)}
.say.loading,.ghost.loading{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.say.loading,.ghost.loading{animation:none;opacity:.5}}
.status{font-size:14px;margin:0}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)}
.settings h2{font-family:var(--cond);font-weight:700;font-size:24px;margin:0}
.settings a{color:var(--ink)}
.err .detail{font-size:13px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.banner{background:var(--soft);border-left:3px solid var(--bad);padding:10px 12px;margin:0 0 18px;font-size:15px}

/* Module chrome */
.bar{flex:none;background:var(--c);color:var(--on);padding:6px 16px 14px}
.bar .row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:38px}
.back{border:0;background:none;padding:6px 8px 6px 0;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:2px}
.tools{display:flex;gap:6px;align-items:center}
.pill{border:1.5px solid currentColor;background:none;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--on);color:var(--c)}
.bar h1{font-family:var(--cond);font-weight:700;font-size:32px;line-height:1.02;margin:2px 0 0}
.bar p{margin:3px 0 0;font-size:14px;opacity:.88}
.feed{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 24px;overscroll-behavior:contain}
.empty{color:var(--muted);text-align:center;padding:44px 12px;font-size:15px}
.empty .big{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--ink);display:block;margin-bottom:6px}

.composer{flex:none;border-top:1px solid var(--line);background:var(--paper);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:21px;padding:9px 15px;font:inherit;font-size:16px;line-height:1.4;max-height:140px;background:var(--paper);color:var(--ink)}
.composer textarea:disabled{background:var(--soft)}
.send,.mic{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;padding:0}
.send{border:0;background:var(--c);color:var(--on)}
.send:disabled{opacity:.35}
.send .i-stop{display:none}.send.stop .i-send{display:none}.send.stop .i-stop{display:grid}
.mic{border:1px solid var(--line);background:none}
.mic.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.ic,.send span{display:grid;place-items:center}
.strip{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px 0;font-size:14px;color:var(--muted)}

/* Turns */
.turn{padding:12px 0 18px;border-bottom:1px solid var(--line)}
.turn:last-child{border-bottom:0}
.qrow{display:flex;justify-content:flex-end;margin:4px 0 12px}
.qbubble{background:var(--soft);border-radius:16px;padding:6px 14px;max-width:85%;overflow-wrap:anywhere}
.qbubble.de{font-family:var(--serif)}
.line{margin:0 0 10px;overflow-wrap:anywhere}
.lbl{font-weight:600}
.de-text{font-family:var(--serif);font-style:italic;font-size:17px}
.de-big{font-family:var(--serif);font-size:21px;line-height:1.45}
.bd{margin:6px 0 12px;padding-left:20px}
.bd li{margin:0 0 7px}
.frag{font-family:var(--serif);font-weight:500;border:0;background:none;padding:0;text-align:left;text-decoration:underline dotted;text-decoration-thickness:1px;text-underline-offset:3px}
.func{color:var(--muted)}
.say{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:inline-grid;place-items:center;vertical-align:-8px;padding:0;color:var(--ink)}
.say.playing,.frag.playing{color:var(--focus);border-color:var(--focus)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--c);color:var(--on);border-color:transparent}
.primary{background:var(--c);color:var(--on);border:0;border-radius:999px;padding:10px 22px;font-weight:600;margin-top:18px}

.verdict{display:inline-flex;align-items:center;gap:7px;font-weight:600;margin:0 0 10px;font-size:16px}
.verdict .dot{width:11px;height:11px;border-radius:50%}
.v-correct .dot{background:var(--ok)}.v-almost .dot{background:var(--warn)}.v-wrong .dot{background:var(--bad)}
del.x{background:var(--strike);text-decoration:line-through;text-decoration-color:var(--bad);border-radius:2px;padding:0 2px}
ins.x{background:var(--hl);text-decoration:none;border-radius:2px;padding:0 2px}
.pair{border-left:3px solid var(--c);padding:2px 0 2px 12px;margin:4px 0 12px}
.pair .line:last-child{margin-bottom:0}
.errs{margin:0 0 12px;padding-left:20px;font-size:15px}
.errs li{margin-bottom:5px}
.tip{background:var(--soft);padding:9px 12px;border-radius:4px;font-size:15px;margin:0}

.ghost{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:14px}

/* Übersetzer: structures */
.lit{color:var(--muted);font-style:italic}
.sect{font-family:var(--cond);font-weight:700;font-size:20px;margin:18px 0 8px}
.st-0{--sc:var(--yellow);--sca:rgba(242,194,0,.42);--sct:#1D1D1B}
.st-1{--sc:var(--green);--sca:rgba(62,150,99,.32);--sct:#FFFFFF}
.st-2{--sc:var(--red);--sca:rgba(213,87,75,.3);--sct:#FFFFFF}
.st-3{--sc:var(--blue);--sca:rgba(70,119,196,.32);--sct:#FFFFFF}
mark.sm{background:var(--sca);color:inherit;border-radius:3px;padding:0 2px}
.sn{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--sc);color:var(--sct);font:700 10px/1 var(--sans);font-style:normal;vertical-align:super;margin-left:2px}
.st{border-left:3px solid var(--sc);padding:2px 0 2px 12px;margin:0 0 16px}
.st-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px}
.st-h .sn{vertical-align:baseline;margin:0;width:20px;height:20px;font-size:12px;flex:none}
.pat{display:inline-block;font-family:var(--cond);font-weight:600;font-size:15px;background:var(--soft);border-radius:4px;padding:1px 8px;margin:6px 0 2px}
.st-x{margin:4px 0 6px;font-size:15px}
.ex{margin:0;padding-left:18px;font-size:15px}
.ex li{margin:0 0 6px}
.ex .frag{font-style:italic}

/* Kaffeeklatsch */
.msg{display:flex;flex-direction:column;margin:12px 0}
.msg.her{align-items:flex-start}.msg.me{align-items:flex-end}
.who{font-size:12px;color:var(--muted);margin:0 6px 3px}
.bubble{max-width:86%;padding:9px 14px;border-radius:18px;font-family:var(--serif);font-size:17px;line-height:1.45;overflow-wrap:anywhere}
.her .bubble{background:var(--soft);border-bottom-left-radius:5px}
.me .bubble{background:var(--c);color:var(--on);border-bottom-right-radius:5px}
.meta{display:flex;gap:6px;margin-top:5px;align-items:center}
.mini{border:0;background:none;padding:2px 4px;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.tr{font-size:14px;color:var(--muted);margin-top:4px;max-width:86%}
.fix{max-width:86%;font-size:14px;margin-top:7px;border-right:3px solid var(--yellow);padding:2px 10px;text-align:right}
.fix .better{font-family:var(--serif);font-style:italic;font-size:15px;display:block;color:var(--ink)}
.fix .why{color:var(--muted)}
.start{padding:30px 2px}
.start .big{font-family:var(--serif);font-size:22px;margin:0 0 4px}
.msg.cont{margin-top:4px}
.contacts{display:grid;gap:8px;margin:0 0 30px}
.contact{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:14px;padding:4px 4px 4px 0}
.crow{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:6px 6px 6px 10px}
.ava{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:var(--aon);font-family:var(--cond);font-weight:700;font-size:20px}
.cinfo{flex:1;min-width:0;display:grid}
.cinfo b{font-weight:600}
.cprev{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctime{flex:none;font-size:12px;color:var(--muted);align-self:flex-start;padding-top:8px}
.cdel{flex:none;border:0;background:none;color:var(--muted);font-size:20px;line-height:1;width:34px;height:34px;border-radius:50%}
.prof{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0 6px}
.prof .ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.prof .ph div{display:grid}
.prof .ph div span{font-size:14px;color:var(--muted)}
.prof ul{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-family:var(--serif);font-size:15px}
.vnote{display:flex;align-items:center;gap:10px;min-width:210px}
.vplay{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--c);color:var(--on);display:grid;place-items:center;padding:0}
.vplay.playing{background:var(--focus)}
.vplay.loading{animation:pulse 1s infinite}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:26px;opacity:.6}
.wave i{flex:1;max-width:4px;border-radius:2px;background:currentColor}
.vlen{flex:none;font-family:var(--sans);font-size:13px;color:var(--muted)}
.vtext{font-family:var(--serif);font-style:italic;font-size:16px;max-width:86%;margin-top:6px}
/* Kaffeeklatsch 18+: register labels */
.rl{display:inline-block;font-family:var(--cond);font-weight:600;font-size:12.5px;line-height:1;padding:3px 7px 3px;border-radius:999px;border:1px solid var(--line);color:var(--muted);vertical-align:1px;white-space:nowrap}
.rl.r-warn{border-color:var(--warn);color:var(--warn)}
.rl.r-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.rl.r-ok{border-color:var(--ok);color:var(--ok)}
.reg{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:5px;font-size:14px;max-width:86%}
.reg b{font-family:var(--serif);font-weight:500;font-size:15px}
.reg .rx{color:var(--muted)}
.tone{max-width:86%;font-size:14px;margin-top:6px;text-align:right;color:var(--muted)}
.tone .rl{margin-right:6px}
.field textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:8px 12px;font:inherit;font-size:16px;line-height:1.4;resize:vertical;background:var(--paper);color:var(--ink)}

.thinking{color:var(--muted);font-size:15px;display:flex;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap}
.dots{display:inline-flex;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}}
.err{border-left:3px solid var(--bad);padding:6px 12px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 15px;border-radius:18px;font-size:14px;max-width:90vw;z-index:9;text-align:center}
</style>
</head>
<body>
<div id="app">
  <section id="home" class="screen" aria-label="Doichi"></section>
  <section id="ueber" class="screen" hidden></section>
  <section id="satz" class="screen" hidden></section>
  <section id="sag" class="screen" hidden></section>
  <section id="kaffee" class="screen" hidden></section>
</div>
<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false || c === "") continue;
    n.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return n;
}
const str = v => typeof v === "string" ? v.trim() : (v == null ? "" : String(v).trim());
const arr = v => Array.isArray(v) ? v : [];
const noDot = s => s.replace(/[.\s]+$/, "");
const store = {
  get(k, d) { try { const v = localStorage.getItem("doichi." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("doichi." + k, JSON.stringify(v)); } catch {} }
};
const settings = { name: store.get("name", "Axel"), slow: store.get("slow", false), level: store.get("level", "B1"), about: store.get("about", "") };
const LEVELS = ["A2", "B1", "B2"];
const lvl = () => LEVELS.includes(settings.level) ? settings.level : "B1";
const lvlUp = () => ({ A2: "B1", B1: "B2", B2: "C1" })[lvl()];
const userName = () => (settings.name || "").trim() || "Axel";

const ICON = {
  speak: '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>',
  send: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>',
  stop: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg>',
  mic: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/></svg>',
  play: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>',
  back: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>'
};

let toastTimer;
function toast(msg) {
  let t = $(".toast");
  if (!t) { t = h("div", { class: "toast", role: "status" }); document.body.append(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4500);
}
function thinking(label = "Denkt nach") {
  const hint = h("span", { class: "small", hidden: true, text: "(a veces tarda hasta un minuto)" });
  const node = h("div", { class: "thinking" }, label, h("span", { class: "dots" }, h("i"), h("i"), h("i")), hint);
  setTimeout(() => { if (node.isConnected) hint.hidden = false; }, 9000);
  return node;
}
const toEnd = feed => requestAnimationFrame(() => { feed.scrollTop = feed.scrollHeight; });
const toTop = (feed, node) => requestAnimationFrame(() => { feed.scrollTop = Math.max(0, node.offsetTop - feed.offsetTop - 8); });

/* ---------- speech ---------- */
// Natural voices come from Gemini's text-to-speech models; the device voice is the free, offline fallback.
const GEMINI_VOICES = [
  ["Kore", "Kore (weiblich, klar)"], ["Aoede", "Aoede (weiblich, locker)"], ["Leda", "Leda (weiblich, jung)"],
  ["Sulafat", "Sulafat (weiblich, warm)"], ["Charon", "Charon (männlich, ruhig)"], ["Iapetus", "Iapetus (männlich, klar)"],
  ["Puck", "Puck (männlich, fröhlich)"]
];
settings.voice = store.get("voice", "g:Kore");
let deVoices = [];
let deVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();

  const grow = () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 140) + "px"; };

    end() { ctl = null; send.classList.remove("stop"); send.setAttribute("aria-label", "Senden"); sync(); },

// Marks the words of each structure inside the German sentence (colour + number per structure).
function markStructures(de, sts) {
  const toks = de.split(/\s+/).filter(Boolean);
  const key = t => normTok(t).toLowerCase();
  const owner = new Array(toks.length).fill(-1), ends = {};
  sts.forEach((s, i) => {
    let from = 0, last = -1;
    const parts = arr(s.parts).map(str).flatMap(p => p.split(/\s*(?:…|\.\.\.)\s*/)).filter(Boolean);
    for (const p of parts) {
      const pt = p.split(/\s+/).map(key).filter(Boolean);
      if (!pt.length) continue;
      const fits = k => pt.every((w, j) => k + j < toks.length && owner[k + j] === -1 && key(toks[k + j]) === w);
      let k = -1;
      for (let x = from; x <= toks.length - pt.length && k < 0; x++) if (fits(x)) k = x;
      for (let x = 0; x < from && k < 0; x++) if (fits(x)) k = x;
      if (k < 0) continue;
      for (let j = 0; j < pt.length; j++) owner[k + j] = i;
      from = k + pt.length; last = Math.max(last, k + pt.length - 1);
    }
    if (last >= 0) (ends[last] = ends[last] || []).push(i);
  });
  const out = h("span");
  let k = 0;
  while (k < toks.length) {
    if (k) out.append(" ");
    const o = owner[k];
    let e = k;
    while (o >= 0 && e + 1 < toks.length && owner[e + 1] === o && !ends[e]) e++;
    const txt = toks.slice(k, e + 1).join(" ");
    const tail = o >= 0 ? (txt.match(/[.,!?;:»«„“"')]+$/) || [""])[0] : "";
    out.append(o >= 0 ? h("mark", { class: "sm st-" + o }, txt.slice(0, txt.length - tail.length)) : txt);
    for (const i of ends[e] || []) out.append(h("sup", { class: "sn st-" + i, text: String(i + 1) }));
    if (tail) out.append(tail);
    k = e + 1;
  }
  return out;
}

    comp.setDisabled(false);
    const signal = comp.start();
    const n = c.msgs.length, t0 = Date.now();
    try {
      let items;
      try {
        const d = await ask("json", prompt(mode, isVoice), { signal, modelTier: "quick", safety: c.adult ? ADULT_SAFETY : null });
        if (c !== kk.c || n !== c.msgs.length || !kk.started) { slot.remove(); return; }
        if (mode === "open") { c.profile = cleanProfile(d && d.profile); if (c.profile) feed.prepend(profileEl(c)); }
        const lastMe = [...c.msgs].reverse().find(m => m.who === "me");
        const fx = d && d.fix;
        if (!mode && lastMe && fx && str(fx.better) && str(fx.better) !== lastMe.text) {
          lastMe.fix = { better: str(fx.better), why: str(fx.why) };
          if (lastMe.node) lastMe.node.append(fixEl(lastMe.fix));
        }
        const tn = c.adult && !mode && d && d.tone;
        if (lastMe && !lastMe.tone && tn && str(tn.label)) {
          lastMe.tone = { label: fitLabel(str(tn.label), TONE_LABELS), note: str(tn.note) };
          if (lastMe.node) lastMe.node.append(toneEl(lastMe.tone));
        }
        const regOf = m => c.adult ? arr(m && m.reg).map(r => ({ de: str(r && r.de), label: fitLabel(str(r && r.label), REG_LABELS), es: str(r && r.es) })).filter(r => r.de && r.label).slice(0, 2) : [];
        let msgs = arr(d && d.messages).map(m => typeof m === "string" ? { de: str(m), es: "", reg: [] } : { de: str(m && (m.de || m.text)), es: str(m && m.es), reg: regOf(m) }).filter(m => m.de);
        if (!msgs.length && str(d && d.reply)) msgs = [{ de: str(d.reply), es: str(d.es), reg: [] }];
        if (!msgs.length) throw { code: "empty_completion" };
        msgs = msgs.slice(0, 3);
        if (isVoice) msgs = [{ de: msgs.map(m => m.de).join(" "), es: msgs.map(m => m.es).filter(Boolean).join(" "), reg: msgs.flatMap(m => m.reg).slice(0, 3) }];
        items = msgs.map(m => ({ who: "her", text: m.de, es: m.es, reg: m.reg.length ? m.reg : undefined, voice: isVoice || undefined, t: Date.now() }));
        c.msgs.push(...items);
        const mem = str(d && d.remember);
        if (mem && !/^vac[ií]o$/i.test(mem) && !arr(c.notes).includes(mem)) c.notes = [...arr(c.notes), mem].slice(-15);
        saveContact(c);
      } catch (e) {
        const er = c.adult && e && e.code === "refused" ? { code: "refused_adult" } : e;
        if (c === kk.c && kk.started) slot.replaceChildren(errBox(er, () => { slot.remove(); reply(mode); })); else slot.remove();
        return;
      }
      // Audio in the background: her voice note now, or the text messages for a fast first tap.
      if (!isVoice) { if (auto) prefetchSpeech(items.map(m => m.text).join(" "), c.voice); else for (const m of items) prefetchSpeech(m.text, c.voice); }
      // Deliver like a real chat: typing time grows with the length; a voice note is "recorded" first.
      // Pressing stop (or leaving) skips the waiting and shows everything at once.
      let fast = false;
      const pause = async ms => { if (fast || ms <= 0) return; try { await sleepFor(ms, signal); } catch { fast = true; } };
      const before = c.msgs[c.msgs.length - items.length - 1];
      let cont = !!(before && before.who === "her" && mode !== "return");
      let cur = slot;
      const nodes = [];
      for (let i = 0; i < items.length; i++) {
        const m = items[i];
        if (!cur) { cur = h("div", { class: "msg her cont" }, thinking(`${c.name} schreibt`)); feed.append(cur); toEnd(feed); }
        if (m.voice) {
          cur.replaceChildren(thinking(`${c.name} nimmt eine Sprachnachricht auf`));
          const tRec = Date.now(), job = prefetchSpeech(m.text, c.voice);
          if (job && !fast) {
            try { const blob = await Promise.race([withTimeout(job, 15000), sleepFor(15000, signal).then(() => null)]); if (blob) m.dur = await wavSeconds(blob); }
            catch (e) { if (e && e.code === "cancelled") fast = true; }
          }
          await pause(1800 - (Date.now() - tRec));
        } else {
          const target = Math.min(3200, 500 + 28 * m.text.length);
          await pause(i === 0 ? target - (Date.now() - t0) : target * 0.7);
        }
        if (c !== kk.c || !kk.started) return;
        const node = herEl(m, cont);
        cont = true; cur.replaceWith(node); cur = null; nodes.push(node);
        toEnd(feed);
      }
      saveContact(c);
      if (auto && nodes.length) {
        const play = nodes[nodes.length - 1].play;
        speak(items.length === 1 ? items[0].text : items.map(m => m.text).join(" "), play, { voice: c.voice });
      }
    } finally {
      comp.end(); toEnd(feed);
      if (kk.started) comp.ta.focus({ preventScroll: true });
    }
  }
  renderStart();
}

/* ---------- boot ---------- */
initHome(); initUeber(); initSatz(); initSag(); initKaffee();
show(route());
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
